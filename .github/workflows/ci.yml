# Continuous integration.
#
# Every push to main, pull requests to main (Dependabot's included) and manual runs. The release workflow tests again
# on the tag.
#
#   app      macOS (as the release build): npm ci, typecheck, unit + integration tests.
#   app-windows  Windows: the same, without the POSIX-only tests.
#   site     ubuntu: the website's unit tests, build (live demo included) and dist guard.
#
# No secrets, read-only token, actions pinned by commit SHA (Dependabot keeps them current: .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its run; on main a run in progress always finishes (one waiting run, the newest).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  app:
    name: App — typecheck and tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install tmux (integration tests)
        run: command -v tmux >/dev/null || brew install tmux

      - name: Unit and integration tests
        run: npm test

  # Windows: the same suite, where the tests that need POSIX are left out (tests/support/posix-only.ts) or tag
  # themselves. It fails the run like the others: the release build tests on Windows too, so a red that waited here
  # would only stop a release later.
  app-windows:
    name: App on Windows — typecheck and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # atelier-bridge.exe and atelier-procs.exe (MSVC): the Windows tests run them.
      - name: Build the bridge and atelier-procs
        run: npm run build:bridge

      - name: Unit and integration tests
        run: npm test

  site:
    name: Website — tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # The site build runs the app's build:demo first (the live demo: vite and the renderer's packages from the root).
      # No lifecycle scripts: node-pty's native build and Electron's download are not needed to bundle the renderer.
      - name: Install the app's dependencies (live demo build)
        run: npm ci --ignore-scripts

      - name: Install the site's dependencies
        run: npm --prefix site ci

      - name: Unit tests, build and dist guard
        run: npm --prefix site test
